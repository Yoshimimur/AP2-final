<VirtualHost *:8081>
    ServerName localhost
    DocumentRoot "C:/Users/VSO/OneDrive - VOK DAMS/Desktop/ABSCHLUSSPROJEKT/02_Anwendung/QR-DocManager/public"

    # Die installierte PHP-8.5-NTS (Non-Thread-Safe)-Version wird über CGI ausgeführt
    SetEnv PHPRC "C:/Users/VSO/OneDrive - VOK DAMS/Desktop/ABSCHLUSSPROJEKT/02_Anwendung/QR-DocManager/apache"
    ScriptAlias /qr-php85/ "C:/Users/VSO/AppData/Local/Microsoft/WinGet/Packages/PHP.PHP.NTS.8.5_Microsoft.Winget.Source_8wekyb3d8bbwe/"
    Action qr-php85 /qr-php85/php-cgi.exe

    <Directory "C:/Users/VSO/AppData/Local/Microsoft/WinGet/Packages/PHP.PHP.NTS.8.5_Microsoft.Winget.Source_8wekyb3d8bbwe">
        AllowOverride None
        Options +ExecCGI
        Require all denied
        <Files "php-cgi.exe">
            Require all granted
        </Files>
    </Directory>

    <Directory "C:/Users/VSO/OneDrive - VOK DAMS/Desktop/ABSCHLUSSPROJEKT/02_Anwendung/QR-DocManager/public">
        AllowOverride FileInfo
        Options -Indexes -MultiViews
        DirectoryIndex index.php
        Require all granted
        <FilesMatch "\.php$">
            SetHandler qr-php85
        </FilesMatch>
    </Directory>
</VirtualHost>
